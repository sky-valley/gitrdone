# GitRDone's executable deployment truth. Exocomp executes this file; the
# adjacent manual carries rationale, resolution, and operator-only procedure.
schema_version = 1

[provenance]
source = "hand"
manual = "aikea.md"
fitter = ""

[service]
name = "gitrdone"

[source]
repo = "sky-valley/gitrdone"
ref = "main"

[[req]]
id = "art.gitrdone"
assert = "the GitRDone service binary is executable"
verify = { kind = "file_exec", path = "gitrdone" }

[[req]]
id = "host.gitrdone-user"
assert = "the GitRDone runtime identity exists with gitrdone as its primary group"
gate = "activation"
verify = { kind = "target_user", target = "run.gitrdone", primary_group = "gitrdone" }

[[req]]
id = "host.storage-mount"
assert = "the durable GitRDone storage volume is mounted at /var/lib/gitrdone"
gate = "activation"
verify = { kind = "mountpoint", path = "/var/lib/gitrdone" }

[[build]]
id = "build.gitrdone"
run = ["env", "CGO_ENABLED=0", "go", "build", "-o", "gitrdone", "./cmd/gitrdone"]
produces = ["art.gitrdone"]

[[target]]
id = "run.gitrdone"
kind = "service"
unit = "gitrdone.service"
artifact = "art.gitrdone"
policy = "enabled-active"
restart = "always"
restart_sec = "5s"
[target.systemd]
after = ["network-online.target"]
wants = ["network-online.target"]
[target.systemd.unit]
RequiresMountsFor = "/var/lib/gitrdone"
[target.systemd.service]
Group = "gitrdone"
LimitNOFILE = "524288"
TimeoutStopSec = "150s"
